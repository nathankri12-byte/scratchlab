name: Sortron Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sortron/**"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sortron/native-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sortron/native-app/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync native plugins
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sortron-android-debug-apk
          path: sortron/native-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
